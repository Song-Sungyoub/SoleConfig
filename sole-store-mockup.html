<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sole Store · 목업</title>
<style>
@font-face{font-family:Pretendard;src:url('Assets/Fonts/Pretendard-Regular.ttf')}*{box-sizing:border-box}body{--bg:#f7f9fc;--surface:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#dcdce1;--control:#f0f0f2;--accent:#0865cc;--select:#e8f2ff;margin:0;background:#e7ecf4;color:var(--text);font:14px Pretendard,sans-serif;padding:32px;min-height:100vh;display:grid;place-items:center}body.dark{--bg:#252f3e;--surface:#232b37;--text:#f2f2f4;--muted:#a7a8ae;--line:#3d4047;--control:#34373e;--accent:#63aaff;--select:#183d63;background:#141b25}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:var(--control);border-radius:8px;padding:9px 13px}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #087af5;outline-offset:2px}button:disabled{cursor:default;opacity:.5}.primary{background:#087af5;color:#fff}.link{background:none;color:var(--accent)}.shell{width:860px;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 25px 80px #17273a22}.titlebar{height:49px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:relative}.titlebar strong{position:absolute;left:50%;transform:translateX(-50%);font-size:13px}.close{width:13px;height:13px;padding:0;background:#ff5f57;border-radius:50%;color:transparent}.close:hover{color:#67211a}.right .close{order:2}.titlebar .tools{display:flex;gap:4px}.titlebar button:not(.close){padding:5px 8px;font-size:12px;background:none;color:var(--muted)}main{padding:26px;min-height:510px}h1{font-size:26px;margin:0 0 8px;letter-spacing:-.7px}h2{margin:0;font-size:18px}h3{font-size:14px;margin:0 0 12px}p{line-height:1.65;margin:0;color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:center}.search{display:flex;gap:9px;margin:23px 0 15px}input,textarea,select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px}.search input{flex:1;min-width:0}.filters{display:flex;align-items:center;gap:5px;margin-bottom:17px}.filters button{background:none;font-size:12px;color:var(--muted)}.filters button.active{background:var(--select);color:var(--accent)}.sort{margin-left:auto;color:var(--muted);font-size:11px}.list{display:grid;gap:10px}.card{display:flex;align-items:center;gap:15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}.card:hover{border-color:#8eacd0}.rank{font-size:12px;color:var(--muted);width:12px}.icon{flex-shrink:0;width:47px;height:47px;border-radius:12px;display:grid;place-items:center;color:white;font-size:25px;font-weight:bold;background:linear-gradient(145deg,#68adff,#2655cd)}.md{background:linear-gradient(145deg,#ae95fa,#7050c0)}.icon img{width:47px}.info{flex:1;min-width:0}.name{background:none;padding:0;text-align:left;font-size:16px;font-weight:bold}.desc{font-size:12px;margin:5px 0 8px}.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.actions{text-align:center;min-width:92px}.actions button{min-width:82px;color:var(--accent);background:var(--select)}.actions .primary{background:#087af5;color:white}.status{font-size:10px;color:var(--muted);margin-top:7px}.notice{margin-top:18px;font-size:12px;min-height:20px}footer{border-top:1px solid var(--line);padding:12px 26px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:15px}.demo{max-width:860px;margin:14px auto 0;color:var(--muted);font-size:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.demo button{font-size:11px;padding:6px 9px}.back{margin-bottom:20px;padding-left:0}.detailtop{display:flex;gap:14px;align-items:center}.detailtop .actions{margin-left:auto}.stats{display:flex;gap:30px;margin:22px 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.stats b{display:block;font-size:19px}.stats span{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:10px;margin-bottom:20px}.tabs button{background:none;color:var(--muted)}.tabs .active{background:var(--select);color:var(--accent)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}.shot{margin-top:16px;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden}.shothead{padding:10px;font-size:11px;background:var(--control)}.shotrow{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px}.shotrow:nth-child(odd){background:var(--select)}.caption{font-size:11px;margin-top:8px}.review{padding:14px 0;border-bottom:1px solid var(--line)}.review:last-child{border:0}.review small{color:var(--muted)}textarea{width:100%;height:85px;resize:vertical;margin:10px 0}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.badge{color:var(--accent)}[hidden]{display:none!important}@media(max-width:600px){body{padding:10px}main{padding:17px}.card{padding:12px;gap:10px}.rank{display:none}.meta{gap:6px}.filters{flex-wrap:wrap}.sort{width:100%;margin:5px 0}.heading{gap:10px}.heading button{font-size:12px}.stats{gap:18px}}
</style>
<div style="max-width:100%"><section class="shell"><header class="titlebar" id="titlebar"><button class="close" aria-label="닫기" onclick="notify('목업 창입니다. 실제 앱에서는 닫힙니다.')">×</button><strong>Sole Store</strong><div class="tools"><button onclick="document.body.classList.toggle('dark')">테마 전환</button><button onclick="document.getElementById('titlebar').classList.toggle('right')" title="창 버튼 위치 변경">⇄</button></div></header>
<main><section id="catalog"><div class="heading"><div><h1>Sole Store</h1><p>업무에 필요한 Sole 앱을 한곳에서.</p></div><button onclick="checkUpdates()">↻ 업데이트 확인</button></div><div class="search"><input id="query" aria-label="앱 검색" placeholder="앱 이름, 소개 또는 태그 검색" oninput="render()"><button onclick="document.getElementById('query').value='';render()">지우기</button></div><div class="filters" id="filters"><button class="active" onclick="setFilter('all',this)">전체</button><button onclick="setFilter('installed',this)">설치됨</button><button onclick="setFilter('updates',this)">업데이트 <span id="update-count">1</span></button><span class="sort">누적 다운로드 많은 순 ↓</span></div><div class="list" id="list"></div></section><section id="detail" hidden></section><p class="notice" id="notice" role="status" aria-live="polite">앱을 선택하면 소개와 버전 기록, 리뷰를 볼 수 있습니다.</p></main><footer><span id="connection">● 연결됨 · 통계 예시</span><span id="time">다운로드 수는 검증 완료 기준</span></footer></section><div class="demo"><span>UI 목업 · 모든 통계/리뷰/설치는 예시</span><button onclick="offline=!offline;render();notify(offline?'연결 실패 · 마지막 목록을 표시합니다. 설치된 앱은 실행할 수 있습니다.':'다시 연결되었습니다.');">연결 실패</button><button onclick="noStats=!noStats;render()">통계 없음</button><button onclick="apps[1].installed=null;render();notify('SoleMD 미설치 상태 예시입니다.')">미설치 예시</button><button onclick="location.reload()">초기화</button></div></div>
<script>
const apps=[
{id:'plan',name:'SolePlan',description:'주간 일정과 업무를 정리하세요.',tags:'일정 캘린더 업무',version:'1.2.2',installed:'1.2.2',downloads:1280,rating:4.8,ratings:24,icon:'▦',history:['1.2.2','1.2.1']},
{id:'md',name:'SoleMD',description:'Markdown 문서를 편하게 읽고 쓰세요.',tags:'마크다운 문서 편집',version:'0.4.0',installed:'0.3.1',downloads:940,rating:4.6,ratings:18,icon:'M',history:['0.4.0','0.3.1']},
{id:'config',name:'SoleConfig',description:'설정 파일의 구조와 값을 쉽게 편집하세요.',tags:'JSON XML YAML INI CSV',version:'1.1.0',installed:'1.1.0',downloads:620,rating:null,ratings:0,icon:'<img src="Assets/Icon/SoleConfig-64.png" alt="">',history:['1.1.0','0.1.14'],current:true}
];let filter='all',offline=false,noStats=false,selected=null,tab='intro',busy=false;const $=id=>document.getElementById(id);
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){$('notice').textContent=t}
function action(a){return a.current?'사용 중':!a.installed?'설치':a.installed!==a.version?'업데이트':'실행'}
function button(a){return '<div class="actions"><button '+(a.current||busy||(offline&&a.installed!==a.version)?'disabled':'')+' class="'+(a.installed!==a.version?'primary':'')+'" onclick="runApp(\''+a.id+'\')">'+action(a)+'</button><div class="status">'+(a.current?'현재 실행 중':a.installed?'설치됨 · '+a.installed:'설치 가능')+'</div></div>'}
function render(){const q=$('query').value.trim().toLowerCase();const all=[...apps].sort((a,b)=>noStats?a.name.localeCompare(b.name):b.downloads-a.downloads||a.name.localeCompare(b.name));const list=all.filter(a=>(a.name+' '+a.description+' '+a.tags).toLowerCase().includes(q)&&(filter!=='updates'||(a.installed&&a.installed!==a.version))&&(filter!=='installed'||a.installed));$('list').innerHTML=list.map(a=>'<article class="card"><span class="rank">'+(noStats?'—':all.indexOf(a)+1)+'</span><div class="icon '+a.id+'">'+a.icon+'</div><div class="info"><button class="name" onclick="details(\''+a.id+'\')">'+a.name+' ›</button><p class="desc">'+a.description+'</p><div class="meta"><span>↓ '+(noStats?'집계 확인 불가':a.downloads.toLocaleString())+'</span><span>'+ (a.rating?'★ '+a.rating+' · 리뷰 '+a.ratings:'리뷰 없음')+'</span><span>최신 '+a.version+'</span></div></div>'+button(a)+'</article>').join('')||'<div class="empty">검색 결과가 없습니다.<br>다른 검색어나 필터를 선택하세요.</div>';$('update-count').textContent=apps.filter(a=>a.installed&&a.installed!==a.version).length;$('connection').textContent=offline?'○ 연결 안 됨 · 마지막 예시 목록':'● 연결됨 · 통계 예시';$('time').textContent=noStats?'통계 확인 불가 · 앱 이름순 임시 표시':'다운로드 수는 검증 완료 기준';if(selected)renderDetail()}
function setFilter(f,b){filter=f;document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function checkUpdates(){notify(offline?'업데이트를 확인하지 못했습니다. 사내 연결을 확인하세요.':'확인 완료 · 업데이트 가능한 앱 '+apps.filter(a=>a.installed&&a.installed!==a.version).length+'개 (예시)');render()}
function runApp(id){const a=apps.find(x=>x.id===id);if(a.installed===a.version){notify(a.name+' 실행 요청 · 목업입니다.');return}if(offline)return;busy=true;render();notify('설치 파일 복사·검증 중… (예시)');setTimeout(()=>{busy=false;a.installed=a.version;render();notify('목업: 설치 마법사가 완료되어 실행 버튼으로 변경됐습니다. 다운로드 통계는 목록을 보는 동안 재정렬하지 않습니다.')},1400)}
function details(id){selected=apps.find(a=>a.id===id);tab='intro';$('catalog').hidden=true;$('detail').hidden=false;renderDetail()}
function back(){selected=null;$('detail').hidden=true;$('catalog').hidden=false;notify('앱을 선택하면 소개와 버전 기록, 리뷰를 볼 수 있습니다.');render()}
function renderDetail(){const a=selected;$('detail').innerHTML='<button class="link back" onclick="back()">‹ 모든 앱</button><div class="detailtop"><div class="icon '+a.id+'">'+a.icon+'</div><div><h1>'+a.name+'</h1><p>'+a.description+'</p></div>'+button(a)+'</div><div class="stats"><div><b>'+(noStats?'—':a.downloads.toLocaleString())+'</b><span>검증 완료 다운로드</span></div><div><b>'+(a.rating?'★ '+a.rating:'—')+'</b><span>리뷰 '+a.ratings+'개</span></div><div><b>'+a.version+'</b><span>최신 버전</span></div></div><div class="tabs">'+[['intro','소개'],['versions','버전 기록'],['reviews','리뷰']].map(([k,n])=>'<button class="'+(tab===k?'active':'')+'" onclick="tab=\''+k+'\';renderDetail()">'+n+'</button>').join('')+'</div><div id="tab-body"></div>';let content='';
if(tab==='intro')content='<div class="panel"><h3>앱 소개</h3><p>'+a.description+' '+a.tags+'</p><div class="shot"><div class="shothead">'+a.name+' · 화면 자리 예시</div><div class="shotrow"><b>작업 공간</b><span>보기 · 편집</span></div><div class="shotrow"><span>첫 번째 항목</span><span>선택됨</span></div><div class="shotrow"><span>두 번째 항목</span><span>완료</span></div></div><p class="caption">실제 캡처는 공유 폴더의 detail_info/버전 경로에서 표시할 예정입니다.</p></div>';
if(tab==='versions')content='<div class="panel"><h3>버전별 변경 내용</h3><select aria-label="버전 선택" onchange="document.getElementById(\'release-title\').textContent=this.value">'+a.history.map(v=>'<option>'+v+'</option>').join('')+'</select><h3 id="release-title" style="margin-top:20px">'+a.version+'</h3><p>등록된 변경 내용이 없습니다.</p><p class="caption">버전 선택은 이력 열람입니다. 이전 버전을 자동 설치하지 않습니다.</p></div>';
if(tab==='reviews')content='<div class="panel"><h3>사용자 리뷰</h3>'+(a.ratings?'<div class="review"><b>★★★★★</b><p>업무에 필요한 기능을 빠르게 찾을 수 있어요.</p><small>예시 작성자 · 버전 '+a.version+' · 리뷰 목업</small></div>':'<p>아직 등록된 리뷰가 없습니다.</p>')+'</div><div class="panel"><h3>리뷰 작성 · 목업</h3><p class="caption">실제 게시에는 작성자 인증과 권한 확인이 필요합니다.</p><select id="stars" aria-label="별점"><option value="5">★★★★★ 5점</option><option value="4">★★★★ 4점</option><option value="3">★★★ 3점</option><option value="2">★★ 2점</option><option value="1">★ 1점</option></select><textarea maxlength="1000" id="review-text" placeholder="사용 경험을 남겨주세요 (선택, 최대 1,000자)"></textarea><button class="primary" onclick="previewReview()">미리보기</button><div id="review-preview"></div></div>';
$('tab-body').innerHTML=content}
function previewReview(){$('review-preview').innerHTML='<div class="review"><b>'+ '★'.repeat(Number($('stars').value))+'</b><p>'+escapeText($('review-text').value)+'</p><small>게시되지 않은 미리보기</small></div>';notify('리뷰 미리보기입니다. 서버에 저장하지 않습니다.')}
render();
</script></html>
