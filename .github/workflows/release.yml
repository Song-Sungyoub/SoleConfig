name: Build and release
on:
  push:
    branches: [main]
    paths: [ConfigEditor.csproj, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: soleconfig-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Song-Sungyoub/SoleConfig' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build installer
        run: ./Installer/Build.ps1
      - name: Test packaged application and updater
        run: |
          $version = ([xml](Get-Content ConfigEditor.csproj -Raw)).Project.PropertyGroup.Version
          $msi = (Resolve-Path "dist/SoleConfig-$version-x64.msi").Path
          $test = Start-Process ./dist/portable-win-x64/SoleConfig.exe -ArgumentList @('--self-test', ('"' + $msi + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($test.ExitCode -ne 0) {
            Get-Content ./dist/portable-win-x64/self-test-error.txt -ErrorAction SilentlyContinue
            throw 'Packaged application tests failed.'
          }
          Get-Content ./dist/portable-win-x64/self-test-result.txt
          ./Installer/Test-Updater.ps1 -CommandFile ./dist/portable-win-x64/self-test-updater.ps1
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content ConfigEditor.csproj -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $msi = "dist/SoleConfig-$version-x64.msi"
          gh release create "v$version" $msi --target $env:GITHUB_SHA --title "SoleConfig $version" --notes-file RELEASE-NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten.' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v$version" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release.' }
          $asset = @($release.assets | Where-Object name -eq "SoleConfig-$version-x64.msi")
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.Count -ne 1 -or $asset[0].digest -ne "sha256:$hash" -or $asset[0].size -ne (Get-Item $msi).Length) { throw 'Uploaded installer verification failed; release remains a draft.' }
          gh release edit "v$version" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
