function flatten(nodes=docs[format],parent='$',depth=0,all=true){return nodes.flatMap(n=>[{n,path:parent+'/'+n.name,depth},...(n.children&&(all||n.open)?flatten(n.children,parent+'/'+n.name,depth+1,all):[])])}
function current(id){return flatten().find(x=>x.n.id===id)}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2800)}
function snapshot(){history.push({format,data:structuredClone(docs[format])});if(history.length>50)history.shift()}
function commit(id,value){const item=current(id);if(!item)return;if(item.n.value===value)return;snapshot();if(item.n.original===undefined)item.n.original=item.n.value;item.n.value=value;item.n.changed=value!==item.n.original;render()}
function validate(n,value){if(n.type==='Number'&&(!/^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?$/.test(value)))throw Error('올바른 숫자를 입력하세요.');if(n.type==='Number'&&n.name==='port'&&(!Number.isInteger(Number(value))||+value<1||+value>65535))throw Error('포트는 1–65535 범위의 정수여야 합니다.');if(n.type==='Boolean'&&!['true','false'].includes(value))throw Error('true 또는 false를 입력하세요.');if(format==='INI'&&/[\r\n]/.test(value))throw Error('이 INI 예제는 한 줄 값만 지원합니다.')}
function select(id){selected=id;const item=current(id);if(!item)return;$('#detailpath').textContent=item.path;$('#detailnote').textContent=item.n.note||(item.n.children?'화살표로 하위 항목을 펼치거나 접을 수 있습니다.':'값을 더블클릭하거나 속성 메뉴에서 수정하세요.');$$('tr[data-id]').forEach(r=>r.classList.toggle('selected',r.dataset.id===id));}
function nodeValue(n){if(n.children)return n.type==='Array'?n.children.map(nodeValue):Object.fromEntries(n.children.map(c=>[c.name,nodeValue(c)]));return n.type==='Number'?Number(n.value):n.type==='Boolean'?n.value==='true':n.value}
function source(){const nodes=docs[format];if(format==='JSON')return JSON.stringify(Object.fromEntries(nodes.map(n=>[n.name,nodeValue(n)])),null,2);if(format==='INI')return nodes.map(g=>g.name+'\n'+g.children.map(n=>n.name+' = '+n.value).join('\n')).join('\n\n');if(format==='CSV'){const quote=v=>'"'+v.replaceAll('"','""')+'"';return [nodes[0].children.map(n=>n.name).join(','),...nodes.map(r=>r.children.map(n=>quote(n.value)).join(','))].join('\n')};if(format==='YAML'){function y(ns,d=0){return ns.map(n=>' '.repeat(d)+n.name+': '+(n.children?(n.name==='defaults'?'&base':'')+'\n'+y(n.children,d+2):n.type==='Alias'?'*base':n.type==='Number'||n.type==='Boolean'?n.value:JSON.stringify(n.value))).join('\n')}return '---\n'+y(nodes[0].children)}function xml(n,d=0){const p=' '.repeat(d);if(!n.children){if(n.type==='Comment')return p+'<!-- '+n.value.replaceAll('--','—')+' -->';return p+esc(n.value)}const attrs=n.children.filter(c=>c.name.startsWith('@')).map(c=>' '+c.name.slice(1)+'="'+esc(c.value)+'"').join('');return p+'<'+n.name+attrs+'>'+n.children.filter(c=>!c.name.startsWith('@')).map(c=>xml(c,0)).join('')+'</'+n.name+'>'}return '<?xml version="1.0" encoding="utf-8"?>\n'+nodes.map(n=>xml(n)).join('\n')}
function render(){hideMenu();$('#filename').textContent=files[format];$('#pathfile').textContent=files[format];$('#statusformat').textContent=format;$('#fileicon').textContent={JSON:'{ }',XML:'</>',YAML:'≡',INI:'[ ]',CSV:'▦'}[format];$$('[data-format]').forEach(b=>{b.classList.toggle('active',b.dataset.format===format);b.setAttribute('aria-pressed',b.dataset.format===format)});$('#gridview').classList.toggle('active',view==='grid');$('#sourceview').classList.toggle('active',view==='source');$('#csvoptions').hidden=format!=='CSV'||view!=='grid';$('#expand').disabled=$('#collapse').disabled=format==='CSV'||view==='source';$('#search').disabled=view==='source';let changed=flatten().filter(x=>x.n.changed).length;$('#dirty').textContent=changed?`● ${changed}개 변경됨`:'✓ 변경 없음';$('#dirty').style.color=changed?'#b88d39':'';$('#undo').disabled=!history.length;$('#save').disabled=!changed;$('#count').textContent=format==='CSV'?`${docs.CSV.length}행 · 4열`:`${flatten().length}개 항목`;if(view==='source'){$('#workspace').innerHTML='<pre class="source">'+esc(source())+'</pre>';return}const q=$('#search').value.toLowerCase();if(format==='CSV'){renderCsv(q);return}let rows=flatten(docs[format],'$',0,!!q);if(q){const matches=flatten().filter(x=>(x.n.name+' '+x.n.value).toLowerCase().includes(q));rows=rows.filter(x=>matches.some(m=>m.path===x.path||m.path.startsWith(x.path+'/')))}$('#workspace').innerHTML=rows.length?`<table class="grid" aria-label="${format} 속성 트리 그리드"><thead><tr><th>속성</th><th>값</th><th>자료형</th><th>상태</th><th></th></tr></thead><tbody>${rows.map(({n,depth})=>`<tr data-id="${n.id}" class="${n.id===selected?'selected':''}"><td><div class="namecell" style="--depth:${depth}">${depth?'<i class="guide"></i>':''}${n.children?`<button class="toggle" data-toggle="${n.id}" aria-label="${esc(n.name)} 펼치기/접기" aria-expanded="${n.open}" style="transform:rotate(${n.open?90:0}deg)">${icon('chevron')}</button>`:'<span style="width:16px;flex-shrink:0"></span>'}<span class="nodeicon ${n.children?'group':''}">${n.children?(n.type==='Array'?'[ ]':'{ }'):'·'}</span><span class="label ${n.children?'group-label':''}">${esc(n.name)}</span></div></td><td class="value ${n.type==='Number'?'numeric':''}" data-value="${n.id}">${n.children?`<span class="summary">${n.type==='Array'?'항목':'하위'} ${n.children.length}개</span>`:n.type==='Boolean'?`<button class="bool ${n.value==='true'?'on':''}" data-bool="${n.id}" role="switch" aria-checked="${n.value==='true'}" aria-label="${esc(n.name)}"><span></span></button><span class="booltext">${n.value}</span>`:n.value===''?'<span class="summary">빈 문자열</span>':esc(n.value.split('\n')[0])+(n.value.includes('\n')?'<span class="summary"> · 여러 줄</span>':'')}</td><td><span class="type ${n.type.toLowerCase()}">${n.type}</span></td><td class="mark">${n.changed?'●':''}</td><td><button class="more" data-menu="${n.id}" aria-label="${esc(n.name)} 속성 메뉴">⋯</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty-state">일치하는 속성이 없습니다.</div>';bindRows();select(selected)}
function renderCsv(q){const rows=docs.CSV.filter(r=>r.children.some(n=>n.value.toLowerCase().includes(q)));$('#workspace').innerHTML=`<table class="grid csv" aria-label="CSV 편집 그리드"><thead><tr><th>행</th>${docs.CSV[0].children.map((n,i)=>`<th>${$('#headercheck').checked?esc(n.name):'열 '+String.fromCharCode(65+i)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${r.name}</td>${r.children.map(n=>`<td data-value="${n.id}" data-cell="${n.id}" style="${n.changed?'background:#fff8e8':''}"><div class="cellcontent"><span>${esc(n.value)||'<span class="summary">빈 문자열</span>'}</span><button class="more" data-menu="${n.id}" aria-label="${esc(r.name+'행 '+n.name)} 속성 메뉴">⋯</button></div></td>`).join('')}</tr>`).join('')}</tbody></table>`;bindRows()}
function bindRows(){$$('tr[data-id]').forEach(r=>r.onclick=()=>select(r.dataset.id));$$('[data-toggle]').forEach(b=>b.onclick=e=>{e.stopPropagation();const n=current(b.dataset.toggle).n;n.open=!n.open;render()});$$('[data-bool]').forEach(b=>b.onclick=e=>{e.stopPropagation();select(b.dataset.bool);const n=current(b.dataset.bool).n;commit(n.id,n.value==='true'?'false':'true')});$$('[data-value]').forEach(c=>{c.ondblclick=e=>{if(e.target.closest('button'))return;openEditor(c.dataset.value)};c.oncontextmenu=e=>{e.preventDefault();openMenu(c.dataset.value,e.clientX,e.clientY)}});$$('[data-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();const r=b.getBoundingClientRect();openMenu(b.dataset.menu,r.right-215,r.bottom+4)})}
function hideMenu(){$('#context').hidden=true}
function openMenu(id,x,y){select(id);const item=current(id);if(!item)return;const n=item.n,editable=!n.children&&n.type!=='Alias'&&n.type!=='Comment';const actions=[['edit','값 수정','edit',!editable],['encrypt','암호화…','lock',!editable],['decrypt','복호화…','unlock',!editable],['hash','해시 계산…','hash',!editable],['line'],['copy','값 복사','copy',!!n.children],['path','경로 복사','branch',false],['source','원문 보기','code',false],['line'],['revert','이 값의 변경 되돌리기','undo',!n.changed]];$('#context').innerHTML=`<div class="contexttitle">${esc(n.name)} · ${esc(n.type)}</div>`+actions.map(([a,label,ic,disabled])=>a==='line'?'<hr>':`<button role="menuitem" data-action="${a}" ${disabled?'disabled':''}>${icon(ic)}${label}${a==='edit'?'<kbd>F2</kbd>':''}</button>`).join('');$('#context').hidden=false;const box=$('#context').getBoundingClientRect();$('#context').style.left=Math.max(8,Math.min(x,innerWidth-box.width-8))+'px';$('#context').style.top=Math.max(8,Math.min(y,innerHeight-box.height-8))+'px';$$('[data-action]').forEach(b=>b.onclick=()=>{hideMenu();const a=b.dataset.action;if(a==='edit')openEditor(id);else if(['encrypt','decrypt','hash'].includes(a))openTransform(id,a);else if(a==='copy')copy(n.value);else if(a==='path')copy(item.path);else if(a==='source'){view='source';render()}else if(a==='revert')commit(id,n.original)});$('#context button:not(:disabled)')?.focus()}
function openEditor(id){const item=current(id);if(!item||item.n.children||['Alias','Comment'].includes(item.n.type))return;target=id;select(id);$('#editpath').textContent=item.path;$('#editvalue').value=item.n.value;$('#editerror').textContent='';$('#editnote').textContent=item.n.type+' · '+(item.n.note||'적용한 값은 목업 안에서만 변경됩니다.');$('#editor').showModal();$('#editvalue').focus();$('#editvalue').select()}
$('#editform').onsubmit=e=>{e.preventDefault();try{const n=current(target).n;validate(n,$('#editvalue').value);commit(target,$('#editvalue').value);$('#editor').close();toast('값을 수정했습니다.')}catch(err){$('#editerror').textContent=err.message}};
function clearResult(){$('#result').value='';$('#copyresult').disabled=$('#applyresult').disabled=true;$('#transformerror').textContent=''}
function openTransform(id,action){target=id;mode=action;const item=current(id);$('#transformtitle').textContent={encrypt:'암호화',decrypt:'복호화',hash:'해시 계산'}[action];$('#transformpath').textContent=item.path;$('#algorithm').innerHTML=action==='hash'?'<option>SHA-256 · Hex</option>':'<option>변환 흐름 시연 · DEMO</option>';$('#keyfield').hidden=action==='hash';$('#key').value='';$('#transforminput').value=item.n.value;$('#transformnote').textContent=action==='hash'?'SHA-256은 실제 계산됩니다. 해시는 복호화할 수 없습니다.':'암호화·복호화는 UI 흐름 시연입니다. DEMO 데이터는 실제 암호화가 아니며 보안 목적으로 사용할 수 없습니다.';clearResult();$('#transform').showModal()}
$('#calculate').onclick=async()=>{clearResult();try{const input=$('#transforminput').value;let result;if(mode==='hash'){const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(input));result=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}else{if(!$('#key').value)throw Error('시연용 비밀번호를 입력하세요.');if(mode==='encrypt')result='DEMO:'+btoa(Array.from(new TextEncoder().encode(input),b=>String.fromCharCode(b)).join(''));else{if(!input.startsWith('DEMO:'))throw Error('목업에서 생성한 DEMO: 값만 복호화 시연할 수 있습니다.');result=new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(input.slice(5)),c=>c.charCodeAt(0)))}}$('#result').value=result;$('#copyresult').disabled=false;const n=current(target)?.n;$('#applyresult').disabled=!n||['Number','Boolean'].includes(n.type);if($('#applyresult').disabled)$('#transformerror').textContent='문자열 결과입니다. 자료형을 유지하기 위해 이 값에는 적용할 수 없으며 복사만 가능합니다.'}catch(err){$('#transformerror').textContent=err.message}};
$('#applyresult').onclick=()=>{commit(target,$('#result').value);$('#transform').close();toast('변환 결과를 선택한 속성에 적용했습니다.')};$('#copyresult').onclick=()=>copy($('#result').value);async function copy(v){try{await navigator.clipboard.writeText(v);toast('클립보드에 복사했습니다.')}catch{toast('복사 권한이 없습니다. 결과를 선택해 직접 복사하세요.')}}
['#transforminput','#key','#algorithm'].forEach(s=>$(s).addEventListener('input',clearResult));$('#transform').addEventListener('close',()=>{$('#key').value='';clearResult()});$$('[data-close]').forEach(b=>b.onclick=e=>{e.preventDefault();$('#'+b.dataset.close).close()});
$$('[data-format]').forEach(b=>b.onclick=()=>{format=b.dataset.format;selected=docs[format][0].id;$('#search').value='';render()});$('#gridview').onclick=()=>{view='grid';render()};$('#sourceview').onclick=()=>{view='source';render()};$('#search').oninput=render;$('#headercheck').onchange=render;$('#expand').onclick=()=>{flatten().forEach(x=>x.n.open=true);render()};$('#collapse').onclick=()=>{flatten().forEach(x=>x.n.open=false);render()};$('#undo').onclick=()=>{const prev=history.pop();if(!prev)return;format=prev.format;docs[format]=prev.data;render();toast('이전 변경을 취소했습니다.')};$('#reset').onclick=()=>{snapshot();docs[format]=structuredClone(sample[format]);selected=docs[format][0].id;render();toast('현재 예제를 초기 상태로 되돌렸습니다.')};$('#save').onclick=()=>{snapshot();flatten().forEach(x=>{delete x.n.changed;delete x.n.original});render();toast('목업의 변경 상태를 적용했습니다. 실제 파일은 저장하지 않습니다.')};
document.addEventListener('click',e=>{if(!e.target.closest('#context')&&!e.target.closest('[data-menu]'))hideMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideMenu();if($('dialog[open]'))return;if((e.ctrlKey||e.metaKey)&&e.key==='f'){e.preventDefault();if(view==='grid')$('#search').focus()}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();if(!$('#save').disabled)$('#save').click()}if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();$('#undo').click()}if(e.key==='F2'){e.preventDefault();openEditor(selected)}});$('.traffic .green').onclick=()=>$('.window').classList.toggle('wide');$$('.traffic .red,.traffic .yellow').forEach(b=>b.onclick=()=>document.body.classList.add('minimized'));$('.restore').onclick=()=>document.body.classList.remove('minimized');render();
</script>
<script>
function setTheme(theme){document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-theme]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',b.dataset.theme===theme)});try{localStorage.setItem('soleconfig-theme',theme)}catch{}}
document.querySelectorAll('button[data-theme]').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));
let initialTheme=new URLSearchParams(location.search).get('theme');if(!['light','dark'].includes(initialTheme)){try{initialTheme=localStorage.getItem('soleconfig-theme')}catch{}}setTheme(initialTheme==='dark'?'dark':'light');
</script>
